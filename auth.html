<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revixa — Sign In or Create Account</title>
  <meta name="description" content="Access your Revixa AI Commerce Intelligence OS workspace.">
  
  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: var(--bg-warm-white);
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-fast);
      margin-bottom: 20px;
    }
    .google-btn:hover {
      background: var(--bg-surface-subtle);
      border-color: var(--border-strong);
    }
    .divider-row {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .divider-row::before, .divider-row::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .divider-row span {
      padding: 0 12px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 3px;
      margin-bottom: 20px;
    }
    .auth-tab-btn {
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .auth-tab-btn.active {
      background: #FFFFFF;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .field-input {
      padding: 12px 14px;
      font-size: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition-fast);
    }
    .field-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .auth-footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .auth-footer-note a {
      color: var(--accent-blue);
      text-decoration: underline;
    }
  </style>
</head>
<body class="light-editorial-theme auth-page">

  <!-- Engineering Background Grid Overlay -->
  <div class="engineering-grid-overlay" aria-hidden="true"></div>

  <div class="auth-container">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark">R</span>
        <span class="logo-text">REVIXA</span>
      </a>
      <h1 class="auth-title" id="authHeading">Create Your Account</h1>
      <p class="auth-sub" id="authSubheading">Start your 14-day trial. No credit card required.</p>
    </div>

    <!-- Continue with Google -->
    <button class="google-btn" onclick="handleAuthSubmit()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider-row">
      <span>OR WITH EMAIL</span>
    </div>

    <!-- Sign In / Create Account Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabCreate">Create Account</button>
      <button class="auth-tab-btn" id="tabSignIn">Sign In</button>
    </div>

    <!-- Auth Form -->
    <form class="auth-form" id="authForm" onsubmit="event.preventDefault(); handleAuthSubmit();">
      
      <div class="field-group" id="groupFullName">
        <label for="fullName" class="field-label">FULL NAME</label>
        <input type="text" id="fullName" class="field-input" placeholder="Julian Vance" required>
      </div>

      <div class="field-group">
        <label for="userEmail" class="field-label">WORK EMAIL ADDRESS</label>
        <input type="email" id="userEmail" class="field-input" placeholder="julian@yourstore.com" required>
      </div>

      <div class="field-group">
        <label for="userPassword" class="field-label">PASSWORD</label>
        <input type="password" id="userPassword" class="field-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitAuthBtn" style="margin-top: 8px;">
        Continue to Onboarding →
      </button>
    </form>

    <div class="auth-footer-note">
      By continuing, you agree to Revixa's <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <script>
    const tabCreate = document.getElementById('tabCreate');
    const tabSignIn = document.getElementById('tabSignIn');
    const groupFullName = document.getElementById('groupFullName');
    const authHeading = document.getElementById('authHeading');
    const authSubheading = document.getElementById('authSubheading');
    const submitAuthBtn = document.getElementById('submitAuthBtn');

    tabCreate.addEventListener('click', () => {
      tabCreate.classList.add('active');
      tabSignIn.classList.remove('active');
      groupFullName.style.display = 'flex';
      authHeading.textContent = 'Create Your Account';
      authSubheading.textContent = 'Start your 14-day trial. No credit card required.';
      submitAuthBtn.textContent = 'Continue to Onboarding →';
    });

    tabSignIn.addEventListener('click', () => {
      tabSignIn.classList.add('active');
      tabCreate.classList.remove('active');
      groupFullName.style.display = 'none';
      authHeading.textContent = 'Welcome Back';
      authSubheading.textContent = 'Sign in to access your business insights.';
      submitAuthBtn.textContent = 'Sign In to Workspace →';
    });

    function handleAuthSubmit() {
      submitAuthBtn.textContent = 'Authenticating...';
      submitAuthBtn.disabled = true;
      setTimeout(() => {
        // Successful authentication redirects directly to Onboarding
        window.location.href = 'onboarding.html';
      }, 400);
    }
  </script>
</body>
</html>
